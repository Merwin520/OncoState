# CDT-R state inference on the locked CT cohort (274 patients).
cohort: [correction_batch_1, validation_gate_1, future_eval_1]     # the 274 locked patients (Exp 2.6 batches)
external: [development]                                            # 25 non-locked patients: tau fit + external calibration
no_review: true                                                    # state inference only (K = 0)
energy: {gate_mm: 30.0}
conformal:
  primary: crossfit                 # 5-fold patient-level cross-fitted split conformal; each patient's q excludes its own fold
  folds: 5
  fold_seed: 20261011
  add_external_to_calibration: true
  sensitivity: [external_only]      # q from the 25 non-locked patients only
  alpha_primary: 0.10
  alpha_grid: [0.02, 0.05, 0.10, 0.15, 0.20, 0.30]
gumbel_sinkhorn:
  tau_grid_mm: [1, 2, 3, 5, 7.5, 10, 15, 20, 30]   # tau chosen by lesion-status NLL on the 25 external patients only
  samples: 200
  agreement_accept: 0.95            # sampling-consistency rule: accept if >= 95% of samples give the V0 response
  seed: 7
verifier: {time_limit_s: 30.0, energy_tol: 1.0e-6, max_nogood_cuts: 5}
bootstrap: {n: 2000, seed: 20261011}
